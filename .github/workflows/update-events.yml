name: Update Events Data

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r server/requirements.txt

      - name: Refresh public events data
        run: python -m server.update_public_events

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/events.json
          if git diff --cached --quiet; then
            echo "No events changes to commit."
            exit 0
          fi
          git commit -m "chore: weekly events data refresh"
          git push
